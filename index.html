<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee House - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Шапка сайта (Header) - общая для обеих страниц -->
  <header class="header">
    <div class="container header__container">
      <!-- Логотип -->
      <a href="index.html" class="logo" aria-label="Coffee House Home">
        <img src="img/logo-coffee-house.png" alt="Coffee House Logo" class="logo__img">
      </a>
      
      <!-- Навигация -->
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item"><a href="#hero" class="nav__link nav__link--active">Home</a></li>
          <li class="nav__item"><a href="about.html" class="nav__link">About</a></li>          <li class="nav__item"><a href="#mobile-app" class="nav__link">Our Application</a></li>
          <li class="nav__item"><a href="#footer" class="nav__link">Contact us</a></li>
        </ul>
      </nav>

      <!-- Ссылка на вторую страницу (Каталог/Меню) -->
      <a href="menu.html" class="header__menu-link">
        <img src="img/menu-item.png" alt="Menu icon">
      </a>
    </div>

    <!-- Переключатель темы -->
    <div class="theme">
          <img src="img/Theme-switch.png" alt="">
    </div>
  
  </header>

  <!-- Основной контент страницы -->
    
    <!-- Секция 1: Hero (Главный баннер) -->
    <section id="hero" class="hero">
    <img src="img/hero.png" alt="">
    </section>

    <!-- Секция 2: Slider / Favorite Coffee -->
    <section id="favorite-coffee" class="favorite-coffee">
      <div class="container">
        <img src="img/favorite-coffee.png" alt="">
        

    <!-- Секция 3: About (О нас) -->
    <section id="about" class="about">
      <div class="container">
<img src="img/about.png" alt="">
      </div>
    </section>

    <!-- Секция 4: Mobile App (Мобильное приложение) -->
    <section id="mobile-app" class="mobile-app">
  <img src="img/mobile app.png" alt="">
    </section>

  </main>

  <!-- Подвал сайта (Footer) - общий для обеих страниц -->
  <footer id="footer" class="footer">
   <img src="img/contacts.png" alt="">
  </footer>

</body>
</html>
